name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', 'gradlew', '*.gradle.kts', 'gradle.properties', 'signing/**', 'tools/verify_apk.py', '.github/workflows/android-debug.yml']
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test and assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK identity and signature
        run: python3 tools/verify_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --output app/build/outputs/apk/debug/version-info.json
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaeminBlack-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/version-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/schemas
          if-no-files-found: ignore
  requested-release:
    # Explicit release request only; reuse the APK that passed this run's tests and signing check.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-apk]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BaeminBlack-debug-${{ github.sha }}
          path: verified-apk
      - name: Publish verified development APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preflight.py --mode release
          mkdir -p deliverable
          cp verified-apk/app-debug.apk deliverable/BaeminBlack-1.1.1.apk
          cp verified-apk/version-info.json deliverable/version-info.json
          sha256sum deliverable/*.apk > deliverable/SHA256SUMS.txt
          PREV=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | head -n 1 || true)
          if [[ -n "$PREV" ]]; then
            mkdir -p old
            if gh release download "$PREV" --pattern 'version-info.json' --dir old; then
              python3 - <<'PY'
          import json, runpy
          verify = runpy.run_path('tools/verify_apk.py')
          verify['compare_new_to_previous'](json.load(open('deliverable/version-info.json')), json.load(open('old/version-info.json')))
          PY
            fi
          fi
          SHORT=${GITHUB_SHA:0:7}
          TAG="dev-1.1.1-$SHORT"
          cat > deliverable/release-notes.md <<'NOTES'
          배민 블랙 1.1.1: 실제 전면 앱 기준 오버레이 제거, attach 이전 중복 등록 방지, 구조 기반 상세 인식, 공유 정보 보존과 자동입력, 일관된 가게/지점 매칭, 예외 메시지·공유 trace 진단 보완.
          기존 Room 스키마, applicationId 및 개발 서명을 유지합니다.
          GitHub Actions 단위 테스트·디버그 빌드·서명 검증을 통과한 APK입니다. 실제 배민 앱과 삼성 기기의 노드·오버레이 위치·서비스 생명주기는 실기기 확인이 필요합니다.
          NOTES
          gh release create "$TAG" deliverable/*.apk deliverable/SHA256SUMS.txt deliverable/version-info.json --target "$GITHUB_SHA" --title "Baemin Black 1.1.1 ($SHORT)" --notes-file deliverable/release-notes.md --prerelease
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
