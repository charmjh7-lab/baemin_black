name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', 'gradlew', '*.gradle.kts', 'gradle.properties', 'signing/**', '.github/workflows/android-debug.yml']
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test and assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK identity and signature
        run: python3 tools/verify_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --output app/build/outputs/apk/debug/version-info.json
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaeminBlack-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/version-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/schemas
          if-no-files-found: ignore
